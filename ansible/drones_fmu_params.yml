---
# Set (or audit) PX4 parameters on every drone's FMU, fleet-wide, over the USB-C MAVLink link.
#
# The values come from docs/params/nxt_params.params -- the same file QGroundControl loads -- so
# that file stays the single source of truth; this playbook only decides WHICH names to push.
# The FMU is reached on /dev/ttyACM0 (or ttyACM1 after an FC reboot), MAVLink auto-enabled by
# SYS_USB_AUTO=2; the uXRCE-DDS link on TELEM2 is not touched. Writes are refused while armed,
# every write is read back, and PX4 persists parameters itself (no reboot; EKF2 re-reads live).
#
#   ansible-playbook -i inventory.ini drones_fmu_params.yml                        # set + verify
#   ansible-playbook -i inventory.ini drones_fmu_params.yml -e fmu_check_only=true # audit only
#   ansible-playbook -i inventory.ini drones_fmu_params.yml -e fmu_param_names=EKF2_TAU_POS
- name: FMU parameters
  hosts: drones
  remote_user: lis
  become: yes            # /dev/ttyACM* is root/dialout-owned
  vars:
    fmu_param_names: "EKF2_TAU_POS,EKF2_DELAY_MAX,EKF2_GPS_DELAY,EKF2_ASP_DELAY,EKF2_ACC_NOISE,EKF2_GYR_NOISE,EKF2_GYR_B_NOISE"
    fmu_params_file: "{{ playbook_dir }}/../docs/params/nxt_params.params"
    fmu_check_only: false
    fmu_device: ""       # "" = auto-detect /dev/ttyACM*
    fmu_work: "/tmp/fmu_params"
  tasks:
    - name: Work directory
      ansible.builtin.file:
        path: "{{ fmu_work }}"
        state: directory
        mode: "0755"

    - name: Stage the fleet parameter file and the MAVLink script
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ fmu_work }}/{{ item.dest }}"
        mode: "0755"
      loop:
        - { src: "{{ fmu_params_file }}", dest: "nxt_params.params" }
        - { src: "{{ playbook_dir }}/scripts/fmu_set_params.py", dest: "fmu_set_params.py" }

    - name: "{{ 'Audit' if fmu_check_only | bool else 'Set and verify' }} parameters on the FMU"
      ansible.builtin.command: >
        python3 {{ fmu_work }}/fmu_set_params.py
        --from-file {{ fmu_work }}/nxt_params.params
        --names {{ fmu_param_names }}
        {{ ('--device ' ~ fmu_device) if fmu_device | length > 0 else '' }}
        {{ '--check' if fmu_check_only | bool else '' }}
      register: fmu
      changed_when: (not fmu_check_only | bool) and fmu.rc == 0
      failed_when: false

    - name: Result
      ansible.builtin.debug:
        msg: >-
          {% if fmu.rc == 3 %}NO MAVLINK LINK: no /dev/ttyACM* heartbeat -- is the FMU USB-C cable connected?
          {% elif fmu.rc not in [0, 2] %}SCRIPT ERROR rc={{ fmu.rc }}: {{ fmu.stderr | default('') | trim }}
          {% else %}{% set r = fmu.stdout | from_json %}{{ r.device }} sysid {{ r.sysid }} {{ r.mode }}:
          {% for p in r.params %} {{ p.name }} {{ p.before }}->{{ p.after }} {{ 'OK' if p.ok else 'MISMATCH' }};{% endfor %}
          {% if r.armed %} (ARMED){% endif %}{% endif %}

    - name: Fail the host if any parameter did not read back at its target
      ansible.builtin.fail:
        msg: "FMU parameters not at target on {{ inventory_hostname }} (rc={{ fmu.rc }})"
      when: fmu.rc != 0
