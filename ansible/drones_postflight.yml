---

- name: Copy the local log to the right place
  hosts: localhost
  gather_facts: true
  vars:
    timestamp: "{{ lookup('pipe', 'date +%Y/%m/%d/%H%M%S') }}"
  tasks:
    - name: Create facts
      set_fact:
        run_dir: "{{ host_base_path }}/consolidated_logs/{{ timestamp }}"
    - name: Create timestamped run directory on controller
      ansible.builtin.file:
       path: "{{ run_dir }}"
       state: directory
       mode: "0755"

    - name: Copy latest logs to consolidated folder
      ansible.posix.synchronize:
       mode: push
       src: "{{ host_base_path }}/logs/latest"
       dest: "{{ run_dir }}/host"
       recursive: yes
       archive: yes
       compress: yes
       rsync_opts:
         - "--mkpath"
    - name: Create latest consolidated log link
      ansible.builtin.file:
        src: "{{ run_dir }}"
        dest: "{{ host_base_path }}/consolidated_logs/latest"
        state: link

- name: Collect logs from drones into timestamped run folder
  hosts: drones
  remote_user: lis
  gather_facts: true
  tasks:
    # 1. Stop the nodes to ensure files are closed and stats written
    - name: Stop ROS packages to flush logs
      ansible.builtin.systemd:
        name: ros_packages
        state: stopped
        scope: user

    # 2. Wait a moment to ensure IO operations complete
    - name: Wait for shutdown flush
      ansible.builtin.pause:
        seconds: 3

    # 3. Collect the data
    - name: Pull latest log contents from each drone into its hostname subfolder
      ansible.posix.synchronize:
        mode: pull
        src: "{{ drone_base_path }}/logs/latest/"
        dest: "{{ host_base_path }}/consolidated_logs/latest/{{ ansible_hostname }}/"
        recursive: yes
        archive: yes
        compress: yes
        rsync_opts:
          - "--mkpath"
          # mcap (cams/recording.mcap) and db3 (rosbag2 sqlite) are already
          # compressed; skip wire-compression for them to save CPU on both ends.
          - "--skip-compress=mcap,db3,jpg,jpeg,png,zst,gz"
      delegate_to: localhost

    - name: Pull MPC and Planner logs
      ansible.posix.synchronize:
        mode: pull
        src: "{{ item.src }}"
        dest: "{{ host_base_path }}/consolidated_logs/latest/{{ ansible_hostname }}/{{ item.name }}/"
        recursive: yes
        archive: yes
        compress: yes
        rsync_opts:
          - "--mkpath"
          # mcap (cams/recording.mcap) and db3 (rosbag2 sqlite) are already
          # compressed; skip wire-compression for them to save CPU on both ends.
          - "--skip-compress=mcap,db3,jpg,jpeg,png,zst,gz"
      delegate_to: localhost
      ignore_errors: true
      loop:
        - { src: "/tmp/mpc_logs/latest/", name: "mpc_logs" }
        - { src: "/tmp/planner_logs/", name: "planner_logs" }

    - name: Pull Depth logs
      when: enable_depth | default(false) | bool
      ansible.posix.synchronize:
        mode: pull
        src: "/tmp/depth_logs/"
        dest: "{{ host_base_path }}/consolidated_logs/latest/{{ ansible_hostname }}/depth_logs/"
        recursive: yes
        archive: yes
        compress: yes
        rsync_opts:
          - "--mkpath"
          # mcap (cams/recording.mcap) and db3 (rosbag2 sqlite) are already
          # compressed; skip wire-compression for them to save CPU on both ends.
          - "--skip-compress=mcap,db3,jpg,jpeg,png,zst,gz"
      delegate_to: localhost
      ignore_errors: true

    # PX4's serial link during the flight: receive overruns (bytes lost on the UART; about
    # 0.55 lost PX4 messages per overrun on the bench) since drones_preflight.yml or
    # drones_relaunch.yml placed its interrupt, and where the disk writes were completed. A few
    # is the idle level (bench: 2-7 in 3-4 min); hundreds mean disk completions reached the
    # UART's CPU again (bench: 1566 in 3 min at the camera recorder's rate, UART on CPU0).
    - name: Read PX4's serial link counters
      ansible.builtin.script: scripts/px4_uart_guard.sh status
      become: true
      register: uart_guard
      failed_when: false

    - name: Say how PX4's serial link did
      ansible.builtin.debug:
        msg: "{{ uart_guard.stdout_lines | default([uart_guard.msg | default('scripts/px4_uart_guard.sh did not run')]) | select | list }}"

    # Ubuntu's background jobs, paused for the flight by drones_preflight.yml or
    # drones_relaunch.yml, run again from here (scripts/background_jobs.sh).
    - name: Resume Ubuntu's background jobs
      ansible.builtin.script: scripts/background_jobs.sh on
      become: true
      register: bg_jobs
      failed_when: false

    - name: Say what was resumed
      ansible.builtin.debug:
        msg: "{{ bg_jobs.stdout_lines | default([bg_jobs.msg | default('scripts/background_jobs.sh did not run')]) | select | list }}"

    # 4. The nodes are deliberately NOT restarted. Every start of ros_packages creates
    #    a new log directory and points logs/latest at it, so a restart here would hand
    #    drones_selfcalib.yml, or a second run of this playbook, a ground-only
    #    recording instead of the flight. drones_selfcalib.yml leaves the stack
    #    stopped for the same reason, so the two can run in either order, any number
    #    of times. Before the next flight, drones_preflight.yml starts the stack again;
    #    so does drones_relaunch.yml, without the checks.

    # 5. Recover any mcap files whose footer wasn't written.
    #    Both oak_compressed_recorder (cams/recording.mcap) and ros2 bag
    #    (bag/bag_*.mcap) get SIGKILL'd by systemd's cgroup cleanup before
    #    finalize, so the trailing summary/index is missing.  Data records
    #    are intact; recover_mcap.py re-streams them into a well-formed
    #    mcap that Foxglove / mcap-cli can open without any further work.
    - name: Recover truncated mcaps (cams + bag)
      ansible.builtin.shell: |
        set -u
        # Match cams/recording.mcap AND bag/bag_*.mcap under any drone subdir.
        for src in \
            "{{ host_base_path }}/consolidated_logs/latest"/*/cams/recording.mcap \
            "{{ host_base_path }}/consolidated_logs/latest"/*/bag/bag_*.mcap; do
          [ -f "$src" ] || continue
          dst="${src%.mcap}_fixed.mcap"
          # Skip if a fresh _fixed already exists for this src
          if [ -f "$dst" ] && [ "$dst" -nt "$src" ]; then
            echo "skip (already recovered): $src"
            continue
          fi
          echo "recovering: $src"
          if python3 "{{ playbook_dir }}/scripts/recover_mcap.py" "$src" "$dst"; then
            mv -f "$dst" "$src" && echo "  -> $src is now valid"
          else
            echo "  -> WARN: recovery failed for $src (left original in place)"
            rm -f "$dst"
          fi
        done
      args:
        executable: /bin/bash
      delegate_to: localhost
      run_once: true
      changed_when: false

    # 6. Run Analysis
    - name: Analyze consolidated logs
      ansible.builtin.command: >
        python3 scripts/analyze_logs.py --log-dir "{{ host_base_path }}/consolidated_logs/latest"
      args:
        chdir: "{{ playbook_dir }}"
      register: analysis_output
      delegate_to: localhost
      run_once: true

    - name: Display analysis results
      ansible.builtin.debug:
        msg: >-
          {{ analysis_output.stdout_lines + ['',
             'The ROS stack is left STOPPED on every drone, so logs/latest stays on this flight.',
             'Before the next flight: drones_preflight.yml, or drones_relaunch.yml to skip its checks.',
             'Until then Ubuntu runs its background jobs (updates, maintenance) again; both pause them.'] }}
      delegate_to: localhost
      run_once: true
