---
# Self-calibrate every drone in parallel from an ordinary flight recording, report the
# results per drone, and deploy the ones that come back HEALTHY.
#
#   ansible-playbook drones_selfcalib.yml
#   ansible-playbook drones_selfcalib.yml -e selfcalib_log_dir=/home/lis/logs/2026/06/23/174842
#   ansible-playbook drones_selfcalib.yml -e selfcalib_deploy=false      # measure only
#   ansible-playbook drones_selfcalib.yml -e selfcalib_force=true        # deploy non-HEALTHY too
#   ansible-playbook drones_selfcalib.yml --limit nxt3.local -e selfcalib_min_still=4.5   # re-run one drone, shorter standstill
#
# Runs ON the drones. A recording is ~2 GB of camera mcap, so calibrating on the
# controller would mean pulling that per drone over WiFi; only report.json and the
# published chain (a few KB) come back.
#
# DATA USED: from the instant every stream is live (the camera recorder comes up a few
# seconds after the IMU bag) up to selfcalib_window seconds after liftoff, i.e. after the
# takeoff the PX4 land detector reports in the recording. The rest of the flight is not read.
#
# PRECONDITION worth knowing before you fly: the estimator initialises from a STILL
# vehicle and must have settled before it moves. The static-start gate rejects a
# recording unless the vehicle stands still for selfcalib_min_still seconds (10) from that
# first instant: 3 s for the estimator to start (that window has to end within the first
# 5 s) and the rest to settle. Idling motors do not count as motion; being carried, pushed
# or lifting off does. Leave the vehicle untouched on the ground for ~20 s after the stack
# starts before taking off; one that is moved or takes off sooner comes back GATE-FAIL and
# has to be flown again.
#
# STACK STATE: this play stops ros_packages to flush the recording and leaves it STOPPED,
# and so does drones_postflight.yml. Every start of the stack creates a new log directory
# and points logs/latest at it, so a restart by either playbook would hand the other one,
# or a second run of the same one, a ground-only recording instead of the flight. Left
# stopped, logs/latest stays on the flight: the two can run in either order, any number
# of times. Before the next flight, drones_preflight.yml starts the stack again; so does
# drones_relaunch.yml, without the checks.

- name: Self-calibrate the fleet
  hosts: drones
  remote_user: lis
  gather_facts: true
  vars:
    perception_path: "{{ drone_base_path }}/repos/perception_pkgs"
    selfcalib_log_dir: "{{ drone_base_path }}/logs/latest"
    selfcalib_deploy: true
    selfcalib_force: false
    # A bad verdict on one drone must never abort the other ten. Set true only if you
    # want the play to exit non-zero when any drone fails to come back HEALTHY.
    selfcalib_strict: false
    # Seconds of FLIGHT to use, counted from liftoff (the takeoff the PX4 land detector
    # reports in the recording). The tool reads from the instant every stream is live up
    # to this long after liftoff, so time spent on the ground before takeoff does not eat
    # into it. 20 is the tool's own default and the point it was validated at; "" leaves
    # the choice to the tool. Cost scales with the span read: every estimator pass replays
    # all of it, and a run is at least two passes.
    selfcalib_window: "20"
    # Seconds of standstill the recording must begin with, checked by the tool's
    # static-start gate before any estimator work: 3 s for the estimator to start, the
    # rest for it to settle before the vehicle moves.
    #   10   what a trustworthy mount needs. With the trajectory fixed at its start (the
    #        NOUMCAL column) the error was 1.5-3.3 cm on flights with 7-14 s of standstill,
    #        10 cm and more on flights with under 6 s, 4.7 cm on one flight cut down to 6 s.
    #   6    the tool's own default ("" leaves it to the tool): enough for the camera
    #        calibration and the aligned ATE, not for the mount.
    #   4.5  the least the tool validated for the calibration itself; below it the
    #        estimator starts as the vehicle lifts off.
    # A lower value is how to still use a recording that took off too early, when the mount
    # does not matter. A re-run reads the same flight for as long as the stack has not been
    # started again (drones_preflight.yml, drones_relaunch.yml); after that, name the
    # recording with selfcalib_log_dir (the controller table prints its directory).
    selfcalib_min_still: "10"
    # Certify the ATE on a dedicated extra pass running the published chain under the
    # flight config + priors. Costs ~a third of the runtime. Off by default: under the
    # flight-config loop the last warm-start pass tracks it to a median 1.17x with
    # identical verdicts across 12 fleet recordings.
    selfcalib_frozen_check: false
    selfcalib_timeout: 7200

  tasks:
    # ---- 1. flush the recording -------------------------------------------------
    # ros2 bag and the camera recorder only close their files on shutdown, so a bag
    # read while the stack is live is truncated mid-write.
    - name: Stop ROS packages to flush the recording
      become: false            # user-scope systemd needs the lis session bus, not root's
      ansible.builtin.systemd:
        name: ros_packages
        state: stopped
        scope: user
      ignore_errors: true      # not running is fine; we only need it stopped

    - name: Wait for shutdown flush
      ansible.builtin.pause:
        seconds: 3

    # ---- 2. resolve the recording ----------------------------------------------
    - name: Resolve the recording directory
      ansible.builtin.stat:
        path: "{{ selfcalib_log_dir }}"
      register: log_dir_stat

    - name: Fail early if the recording is missing
      ansible.builtin.fail:
        msg: >-
          no recording at {{ selfcalib_log_dir }}. Fly first, or pass
          -e selfcalib_log_dir=/home/lis/logs/YYYY/MM/DD/HHMMSS
      when: not log_dir_stat.stat.exists

    # logs/latest is a symlink that the next start of ros_packages (drones_preflight.yml,
    # drones_relaunch.yml) points at a NEW directory. Hand the tool the real directory
    # instead: report.json then keeps naming the recording it was computed from, and a
    # later run can still be pointed at it with -e selfcalib_log_dir=...
    - name: Pin the recording to its real directory
      ansible.builtin.set_fact:
        sc_recording: "{{ log_dir_stat.stat.lnk_source | default(selfcalib_log_dir) }}"

    # The tool reads bag/ and cams/ natively; both must be present or it is not a
    # flight recording.
    - name: Check the recording has both streams
      ansible.builtin.stat:
        path: "{{ sc_recording }}/{{ item }}"
      register: stream_stat
      loop: [bag, cams]

    - name: Fail if a stream is missing
      ansible.builtin.fail:
        msg: "{{ sc_recording }} has no {{ item.item }}/ — not a flight recording"
      when: not item.stat.exists
      loop: "{{ stream_stat.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Prefer this drone's own published reference; fall back to nxt3's purely as a YAML
    # skeleton. The seed comes from the fleet means either way, so the fallback does not
    # leak nxt3's calibration into another vehicle.
    - name: Look for this drone's fleet reference
      ansible.builtin.stat:
        path: "{{ perception_path }}/selfcalib/fleet_reference/{{ ansible_hostname }}/theta_star.yaml"
      register: own_ref

    - name: Choose the template chain
      ansible.builtin.set_fact:
        sc_ref: "{{ ansible_hostname if own_ref.stat.exists else 'nxt3' }}"
        sc_stamp: "{{ hostvars['localhost']['sc_stamp'] | default(ansible_date_time.iso8601_basic_short) }}"

    # ---- 3. calibrate (async: this is a multi-minute estimator loop) -------------
    - name: Run self-calibration
      ansible.builtin.shell: |
        set -eo pipefail
        source /opt/ros/humble/setup.bash
        source {{ drone_ros_path }}/install/setup.bash
        cd {{ perception_path }}/selfcalib
        python3 tool/run_tool.py \
          --drone {{ ansible_hostname }} \
          --bag {{ sc_recording }} \
          --template fleet_reference/{{ sc_ref }}/theta_star.yaml \
          --imu-chain fleet_reference/{{ sc_ref }}/kalibr_imu_chain.yaml \
          --out {{ drone_base_path }}/selfcalib_out/{{ sc_stamp }} \
          --fleet-exclude {{ ansible_hostname }} \
          {{ ('--after-takeoff ' ~ selfcalib_window) if selfcalib_window | string | length > 0 else '' }} \
          {{ ('--min-still ' ~ selfcalib_min_still) if selfcalib_min_still | string | length > 0 else '' }} \
          {{ '--frozen-check' if (selfcalib_frozen_check | bool) else '' }}
      args:
        executable: /bin/bash
      environment:
        # run_serial.sh resolves the estimator workspace itself and defaults to
        # $HOME/ov_ws_vio, which does not exist here: install-perception.yml links the
        # VIO packages into ros2_swarmnxt_ws so they build alongside everything else
        # (and so ov_msckf finds px4_msgs). Without this the run fails with
        # "no OpenVINS workspace at /home/lis/ov_ws_vio".
        OV_WS: "{{ drone_ros_path }}"
      async: "{{ selfcalib_timeout }}"
      poll: 0
      register: sc_job

    - name: Wait for self-calibration
      ansible.builtin.async_status:
        jid: "{{ sc_job.ansible_job_id }}"
      register: sc_result
      until: sc_result.finished
      retries: "{{ (selfcalib_timeout | int / 15) | int }}"
      delay: 15
      # The tool exits non-zero on gate failure and writes report.json regardless; the
      # verdict is read from that file, never from the exit status.
      failed_when: false

    - name: Cleanup async job
      ansible.builtin.async_status:
        jid: "{{ sc_job.ansible_job_id }}"
        mode: cleanup
      changed_when: false
      failed_when: false

    # ---- 4. collect ------------------------------------------------------------
    - name: Pull results to the controller
      ansible.posix.synchronize:
        mode: pull
        src: "{{ drone_base_path }}/selfcalib_out/{{ sc_stamp }}/"
        dest: "{{ host_base_path }}/calibrations/{{ sc_stamp }}/{{ ansible_hostname }}/"
        recursive: yes
        archive: yes
        rsync_opts:
          - "--mkpath"
          # Trajectories and per-pass harvests are large and only useful on the drone
          # for debugging; the chain, the report and the mount are what matter here.
          - "--exclude=calib/"
          - "--exclude=deploy_check/"
          - "--exclude=*.tum"
      delegate_to: localhost
      failed_when: false

    - name: Read the verdict
      ansible.builtin.slurp:
        src: "{{ drone_base_path }}/selfcalib_out/{{ sc_stamp }}/report.json"
      register: sc_report
      failed_when: false

    # The TOP-LEVEL verdict: it is in every report the tool writes and is the one
    # deploy_vio.py gates on. diagnosis.verdict exists only when the run got as far as the
    # diagnosis -- a GATE-FAIL or ERROR report has no diagnosis block at all, so reading
    # it there fails this task on exactly those drones.
    - name: Record the verdict
      ansible.builtin.set_fact:
        sc_verdict: >-
          {{ ((sc_report.content | b64decode | from_json).verdict | default('NO VERDICT', true))
             if sc_report.content is defined else 'NO REPORT' }}

    # ---- 5. deploy the healthy ones --------------------------------------------
    # Timestamped, with a `current` symlink, mirroring the logs/latest idiom. Never
    # overwritten: a bad calibration must not be able to replace a good one silently,
    # and rolling back is then just repointing the symlink.
    - name: Deploy the calibration
      when:
        - selfcalib_deploy | bool
        - sc_verdict is search('HEALTHY') or (selfcalib_force | bool)
      block:
        - name: Write the flight configuration folder
          ansible.builtin.shell: |
            set -eo pipefail
            source /opt/ros/humble/setup.bash
            cd {{ perception_path }}/selfcalib
            python3 tool/deploy_vio.py \
              --calib-out {{ drone_base_path }}/selfcalib_out/{{ sc_stamp }} \
              --out {{ drone_base_path }}/vio_calib/{{ sc_stamp }} \
              {{ '--force' if (selfcalib_force | bool) else '' }}
          args:
            executable: /bin/bash
          environment:
            OV_WS: "{{ drone_ros_path }}"
          register: sc_deploy

        - name: Point vio_calib/current at it
          ansible.builtin.file:
            src: "{{ drone_base_path }}/vio_calib/{{ sc_stamp }}"
            dest: "{{ drone_base_path }}/vio_calib/current"
            state: link
            force: true

    # ---- 6. the stack stays stopped ---------------------------------------------
    # Deliberately no restart: see STACK STATE at the top. Starting ros_packages here
    # would move logs/latest off the flight this play has just calibrated.


- name: Report the fleet result
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Summarise every drone's report
      ansible.builtin.command: >
        python3 scripts/summarize_selfcalib.py
        --collect-dir {{ host_base_path }}/calibrations/{{ hostvars[groups['drones'][0]]['sc_stamp'] }}
        --json-out {{ host_base_path }}/calibrations/{{ hostvars[groups['drones'][0]]['sc_stamp'] }}/summary.json
        --expect {{ groups['drones'] | map('extract', hostvars, 'ansible_hostname') | select('defined') | join(',') }}
      args:
        chdir: "{{ playbook_dir }}"
      register: sc_summary
      changed_when: false
      # rc 1 means NO drone produced a report -- that is a real failure of the whole
      # run, not one vehicle's bad verdict, and must not be reported as success.
      failed_when: false

    - name: Show it
      ansible.builtin.debug:
        msg: >-
          {{ sc_summary.stdout_lines + ['',
             'The ROS stack is left STOPPED on every drone, so logs/latest stays on this flight.',
             'Before the next flight: drones_preflight.yml, or drones_relaunch.yml to skip its checks.'] }}

    - name: Fail if the run produced nothing at all
      when: sc_summary.rc | default(0) | int != 0
      ansible.builtin.fail:
        msg: >-
          no drone produced a report — the run failed everywhere. This is distinct from
          a bad verdict, which is reported in the table above and is never fatal.

    # Opt-in only. By default a drone that fails is reported, not fatal — the fleet
    # result is the deliverable, and one bad vehicle must not mask the other ten.
    - name: Fail if any drone is not HEALTHY
      when: selfcalib_strict | default(false) | bool
      ansible.builtin.fail:
        msg: "one or more drones did not return HEALTHY — see the table above"
      vars:
        unhealthy: "{{ groups['drones'] | map('extract', hostvars, 'sc_verdict') | select('search', 'HEALTHY') | list }}"
      failed_when: unhealthy | length < groups['drones'] | length
