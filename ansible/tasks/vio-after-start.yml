# The onboard VIO after the stack has been started. Included by drones_preflight.yml and by
# drones_relaunch.yml, with enable_vio or vio_nav.
#
# Three things only a running stack shows. The estimator logs every 5 s what it received and
# fed. vision_pose_node logs "VIO ready: ..." once the estimator's poses have been settled
# for some seconds with the drone standing still and are placed in the room. And with
# vio_nav it then logs "pose source: MOCAP -> VIO (...)" when it hands PX4's pose input to the
# VIO, on the ground only; the last such line has to be that one: a later "VIO -> MOCAP" is
# the fallback, which holds until the stack is started again.
# So leave the drones standing untouched until the playbook has finished, about 15 s after
# the start. That holds without vio_nav too: the estimator can only start while the drone
# stands, and a drone that takes off before it has started gets no pose for the whole flight.
# A drone that fails a wait is stopped again, so that a drone reported as failed is
# not one that is up and would fly on something else than its flags say. With one exception:
# only a drone known to be disarmed is stopped. One that is armed, or whose arming state
# cannot be read, may be flying (the VIO cannot become ready after arming), and stopping the
# stack would take its controller and PX4's pose away: it is left running and reported.
- name: Check the onboard VIO after the start
  block:
    - name: Wait for the estimator to report image sets fed
      ansible.builtin.shell: >-
        pgrep -x run_online_msck > /dev/null &&
        grep -h -F '[online-live]' {{ drone_base_path }}/logs/latest/*/launch.log
        | tail -n 1 | grep -E 'fed=[1-9]'
      register: vio_alive
      changed_when: false
      retries: 18
      delay: 5
      until: vio_alive.rc == 0

    # Without vio_nav PX4 stays on the mocap and nothing is handed over: the wait is for the
    # VIO to be ready. "VIO not ready any more" after it means the drone was moved, "VIO stream
    # restarted" that the estimator's poses jumped in time; both wait for the next "VIO ready".
    - name: Wait for vision_pose_node to report the VIO ready
      when: not (vio_nav | default(false) | bool)
      ansible.builtin.shell: >-
        grep -h -F -e 'VIO ready: ' -e 'VIO not ready any more' -e 'VIO stream restarted'
        {{ drone_base_path }}/logs/latest/*/launch.log
        | tail -n 1 | grep -F 'VIO ready: '
      register: vio_is_ready
      changed_when: false
      retries: 18
      delay: 5
      until: vio_is_ready.rc == 0

    - name: Wait for vision_pose_node to hand PX4 to the VIO
      when: vio_nav | default(false) | bool
      ansible.builtin.shell: >-
        grep -h -F 'pose source: ' {{ drone_base_path }}/logs/latest/*/launch.log
        | tail -n 1 | grep -F 'pose source: MOCAP -> VIO'
      register: vio_handed
      changed_when: false
      retries: 18
      delay: 5
      until: vio_handed.rc == 0
  rescue:
    # The launch log has what was started, every change of the pose source and, while PX4
    # is not fed the VIO, why ("VIO not used: <reason>", one line whenever the reason
    # changes). The node's status topic adds what the reason rests on (whether it has poses,
    # the mocap and a disarmed PX4); it is read once here while the stack still runs. The
    # name of the reason comes from the installed message file, so the numbers are not
    # repeated here.
    - name: Read the reason from the launch log and from vision_pose_node
      ansible.builtin.shell: |
        log="{{ drone_base_path }}/logs/latest/*/launch.log"
        grep -h -F '[vio] ' $log | tail -n 2
        grep -h -F -e 'pose source: ' -e 'VIO ready' -e 'VIO not ready any more' -e 'VIO not used: ' -e 'VIO stream restarted' $log | tail -n 5
        live=$(grep -h -F '[online-live]' $log | tail -n 1)
        [ -n "$live" ] && echo "$live"
        grep -h -F 'process has died' $log | grep -E 'vision_pose_node|run_online_msckf' | tail -n 2 | cut -c1-200
        if echo "$live" | grep -q -E 'fed=[1-9][0-9]* poses=0$'; then
          echo "NOTE: the estimator is fed and has given no pose (poses=0). On a drone that stands still that is an estimator older than perception_pkgs dc8d058: its first pose comes after the takeoff. drones_preflight.yml looks for that commit in the checkout before the start, drones_relaunch.yml does not. If the checkout has it, the estimator was not built again since the checkout moved, or files of the checkout were changed by hand. Either way: run drones_update.yml."
        fi
        ws={{ drone_ros_path }}/install
        if [ -f $ws/setup.bash ]; then
          source /opt/ros/humble/setup.bash
          source $ws/setup.bash
          export ROS_DOMAIN_ID={{ drone_num }}
          st=$(timeout -k 2 10 ros2 topic echo --no-daemon --once /{{ ns }}/vio/status swarmnxt_msgs/msg/VisionPoseStatus 2>/dev/null \
               | grep -E '^(source|use_vio|vio_alive|vio_ready|mocap_valid|armed|fallback_latched|reason|vio_poses):' | tr '\n' ' ')
          r=$(echo "$st" | sed -n 's/.*reason: \([0-9][0-9]*\).*/\1/p')
          why=""
          [ -n "$r" ] && why=$(grep -h -E "^uint8 +REASON_[A-Z_]+ *= *$r([^0-9]|\$)" $ws/swarmnxt_msgs/share/swarmnxt_msgs/msg/VisionPoseStatus.msg 2>/dev/null | head -n 1 | sed 's/^uint8 *//' | tr -s ' ')
          echo "vision_pose_node status: ${st:-none received within 10 s }${why:+($why)}"
        fi
        true
      args:
        executable: /bin/bash
      register: vio_why
      changed_when: false
      failed_when: false

    # "armed: false" in the status vision_pose_node gave just above (from PX4's vehicle status).
    # No status within its 10 s, or "armed: true", leaves the stack running.
    - name: Note whether the drone is known to be disarmed
      ansible.builtin.set_fact:
        vio_drone_disarmed: '{{ (vio_why.stdout | default("")) is search("vision_pose_node status: .*armed: false") }}'

    - name: Stop the stack of this drone
      when: vio_drone_disarmed | bool
      ansible.builtin.systemd:
        name: ros_packages
        state: stopped
        scope: user

    - name: Report the drone as not started
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }}: "{{ ansible_failed_task.name | default('the check of the onboard VIO') }}"
          did not succeed within its time.
          {{ 'The stack of this drone was stopped again.' if (vio_drone_disarmed | bool) else
             'THE STACK OF THIS DRONE WAS LEFT RUNNING: the drone is armed or its arming state could not be read, so it may be flying. Land it, then run the playbook again with the drone standing still.' }}
          {{ 'Its estimator runs and is fed. The drone has to stand untouched from the start of the stack until this playbook has finished.'
             if (vio_alive.rc | default(1)) == 0 else '' }}
          What the launch log and vision_pose_node say:
          {{ vio_why.stdout | default('', true) | trim | default('(nothing: no estimator, no "[vio]" line and no "pose source" line)', true) }}
