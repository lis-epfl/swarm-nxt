# you can change enable_cameras / enable_depth / enable_vio / vio_nav in group_vars/all per drone
# by appending them at the end: nxt1.local enable_depth=true
# (enable_depth turns on cameras + depth estimation; enable_cameras turns on cameras only)
[drones]
; nxt1.local enable_cameras=true
; nxt2.local enable_cameras=true
nxt3.local enable_vio=true
; nxt4.local
; nxt5.local
; nxt6.local enable_cameras=false
; nxt7.local
; nxt8.local
; nxt9.local
; nxt10.local enable_cameras=false
; nxt11.local
; nxt12.local

[drones:vars]
ansible_become_password=orin

