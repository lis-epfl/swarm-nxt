# Lives in ansible/ rather than the repo root: ansible looks for ansible.cfg in the
# CURRENT WORKING DIRECTORY, and every playbook here is run as `cd ansible && ...`.
# At the repo root it is simply never loaded.
#
# forks is the only thing here because it is the only thing that CANNOT live anywhere
# else. It is a controller-side setting resolved before host variables exist, so
# `ansible-config list` offers exactly two sources for it — this file, or the
# ANSIBLE_FORKS environment variable. group_vars/host_vars cannot set it.
[defaults]
# Ansible's built-in default is 5: with more drones than that, tasks run in batches.
# It never fails, and it barely shows on the existing playbooks because every long
# task there is `async: ... poll: 0`, which decouples the real work from forks. What
# it does gate are the synchronous tasks — the rsync pulls in postflight and
# selfcalib. Set above the largest fleet size so those run in one batch.
# Costs one python process per host on the CONTROLLER only; nothing on the drones.
forks = 20
