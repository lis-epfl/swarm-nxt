---
# Start the flight stack on the drones again, without drones_preflight.yml's setup and
# camera checks.
#
#   ansible-playbook -i inventory.ini drones_relaunch.yml
#   ansible-playbook -i inventory.ini drones_relaunch.yml --limit nxt3.local
#
# For flying again after drones_postflight.yml or drones_selfcalib.yml, which both leave
# the stack stopped. It restarts ros_packages, and makes sure the micro_xrce agent is up,
# with the launch file and configuration the last drones_preflight.yml left on the drone.
#
# Two things are checked first, because a stack started over either is not safe to fly:
#   - no self-calibration is still running on the drone;
#   - the drone's clock is tracking the host's, by the same test preflight uses.
# Everything else preflight does is skipped: no camera sync or focus test, chrony is not
# restarted, nothing is rebuilt or sent, and the host's own stack is not touched. Run
# drones_preflight.yml instead after drones_update.yml, after changing the inventory or
# group_vars, and whenever the cameras may have changed -- a reboot or a hard landing.
#
# EVERY START OF THE STACK BEGINS A NEW RECORDING and points logs/latest at it. Collect
# the previous flight first (drones_postflight.yml, drones_selfcalib.yml): run after this
# playbook they read the new recording, not that flight. A drone whose stack was still
# running is called out, because that is how a recording gets left behind.

- name: Relaunch the flight stack
  hosts: drones
  remote_user: lis
  gather_facts: false
  tasks:
    # ---- 1. nothing is started over these two ------------------------------------
    # drones_selfcalib.yml runs the calibration as a detached job: interrupting the playbook
    # on the controller does not stop it on the drone, where it holds the CPU and the GPU
    # for minutes. The [x] in each pattern keeps pgrep from matching the shell that runs
    # it; run_online_msckf, the flight estimator, is deliberately not in the list. The stop
    # command in the message kills the estimator with -9 because nothing less works: it
    # takes SIGTERM as a ROS shutdown request, which its replay loop never looks at, and
    # killing only the tool leaves the pass in progress running to its end.
    - name: Look for a self-calibration still running
      ansible.builtin.shell: pgrep -af '[p]ython3 tool/(run_tool|deploy_vio)\.py|[r]un_serial_msckf' || true
      register: relaunch_selfcalib
      changed_when: false

    - name: Refuse to start under a running self-calibration
      ansible.builtin.fail:
        msg: >-
          a self-calibration is still running on {{ inventory_hostname }}
          ({{ relaunch_selfcalib.stdout_lines | length }} process(es), first:
          {{ relaunch_selfcalib.stdout_lines | first | truncate(100, true) }}).
          Let it finish, or stop it on the drone:
          pkill -f '[t]ool/run_tool.py'; pkill -9 -x run_serial_msck
      when: relaunch_selfcalib.stdout | trim | length > 0

    # Mocap poses reach PX4 with the HOST's timestamp, so a drone whose clock is not on the
    # host's flies on position samples of the wrong age. Same test as drones_preflight.yml
    # (scripts/chronyc_check.py: a reference, and an RMS offset within 5 ms). Preflight
    # restarts chrony and waits for it first; this does not, so a drone that has only just
    # booted may need a moment before it passes.
    - name: Copy the clock-sync check
      ansible.builtin.copy:
        src: scripts/chronyc_check.py
        dest: /tmp/chronyc_check.py
        mode: '0755'

    - name: Check the clock is tracking the host
      ansible.builtin.shell: /tmp/chronyc_check.py
      register: relaunch_clock
      changed_when: false
      failed_when: false

    - name: Refuse to start with an unsynchronised clock
      ansible.builtin.fail:
        msg: >-
          the clock on {{ inventory_hostname }} is not tracking the host
          ({{ (relaunch_clock.stdout_lines | join('; ')) or 'chronyc gave no tracking data -- is chronyd running?' }}).
          Give chrony a moment and run this again, or run drones_preflight.yml, which
          restarts chrony and waits for it.
      when: relaunch_clock.rc != 0

    # ---- 2. start ---------------------------------------------------------------
    # Read before the restart moves it: it is the recording a still-running stack leaves behind.
    - name: Note the current recording
      ansible.builtin.stat:
        path: "{{ drone_base_path }}/logs/latest"
      register: relaunch_prev

    - name: Make sure the MicroXRCE agent is running
      become: false            # user-scope systemd needs the lis session bus, not root's
      ansible.builtin.systemd:
        name: micro_xrce
        state: started
        scope: user

    - name: Restart ros_packages
      become: false
      ansible.builtin.systemd:
        name: ros_packages
        state: restarted
        scope: user
      register: relaunch_stack

    - name: Say which recordings were cut short
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} was still running. The recording it was making,
          {{ relaunch_prev.stat.lnk_source | default('logs/latest') }}, is closed and is no longer
          logs/latest: drones_postflight.yml now collects the new one, and drones_selfcalib.yml
          reaches the old one only with -e selfcalib_log_dir=<that directory>.
      when: (relaunch_stack.status.ActiveState | default('')) in ['active', 'activating']

    # ---- 3. did it stay up ------------------------------------------------------
    # `restarted` returns as soon as systemd has forked the start script, so a launch that
    # dies straight away (no workspace, no launch file) would pass as up. This catches
    # that; it says nothing about the nodes, which the start script launches only after
    # its per-drone stagger delay.
    - name: Give the start script a moment
      ansible.builtin.pause:
        seconds: 5

    - name: Check the stack stayed up
      become: false
      ansible.builtin.shell: XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/run/user/$(id -u)} systemctl --user is-active ros_packages
      register: relaunch_active
      changed_when: false
      failed_when: false

    - name: Fail the drones whose stack did not stay up
      ansible.builtin.fail:
        msg: >-
          ros_packages is {{ relaunch_active.stdout | default('', true) | trim | default('not running', true) }}
          five seconds after the restart. On the drone: journalctl --user -u ros_packages -n 40
      when: relaunch_active.rc != 0
